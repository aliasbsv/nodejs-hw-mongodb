tags:
  - Contacts
summary: Update contact
operationId: patchContact
description: 'Update/patch contact'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name (3-20 chars)"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number (3-20 chars)"
            type: string
            example: '0991234567'
          email:
            description: "Contact's email (3-20 chars)"
            type: string
            example: mail@example.com
          isFavourite:
            description: 'Whether is contact in favourite list'
            type: boolean
            example: false
          contactType:
            description: "Contact's type (default: personal)"
            type: string
            enum: ['work', 'home', 'personal']
          photo:
            description: "Contact's photo upload"
            type: string
            format: binary
responses:
  '200':
    description: 'Update contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
